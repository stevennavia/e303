<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E303</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <audio id="bg-music" src="/music.mp3" loop preload="auto"></audio>
  <div id="mobile-block">Experiencia Dise\u00f1ada para Web</div>
  <div id="game-container"></div>
  <div id="cinematic-overlay"></div>

  <div id="ui-layer">
    <div id="timer">10:00</div>
    <div id="time-notification"></div>
    <div id="inventory"></div>
    <div id="crosshair"></div>
    <div id="interaction-prompt">Presiona E para interactuar</div>
    <div id="game-message"></div>
    <div id="controls-hint">WASD + Mouse para moverte</div>
  </div>

  <div id="start-overlay">
    <div class="overlay-content">
      <button class="start-btn" id="start-btn">COMENZAR</button>
      <button class="dev-btn" id="dev-btn">DEV</button>
    </div>
  </div>

  <div id="end-overlay">
    <div class="overlay-content">
      <button class="retry-btn" id="retry-btn">Reintentar</button>
    </div>
  </div>

  <div id="combo-overlay">
    <div class="combo-panel">
      <div class="combo-header">
        <span class="combo-title">Ingresa la clave</span>
        <button class="combo-close" id="combo-close">&times;</button>
      </div>
      <div class="combo-grid">
        <div class="combo-cell" data-key="violet">
          <div class="combo-color-bar violet"></div>
          <div class="combo-controls">
            <button class="combo-up">&#9650;</button>
            <div class="combo-digit" id="combo-violet">0</div>
            <button class="combo-down">&#9660;</button>
          </div>
        </div>
        <div class="combo-cell" data-key="red">
          <div class="combo-color-bar red"></div>
          <div class="combo-controls">
            <button class="combo-up">&#9650;</button>
            <div class="combo-digit" id="combo-red">0</div>
            <button class="combo-down">&#9660;</button>
          </div>
        </div>
        <div class="combo-cell" data-key="green">
          <div class="combo-color-bar green"></div>
          <div class="combo-controls">
            <button class="combo-up">&#9650;</button>
            <div class="combo-digit" id="combo-green">0</div>
            <button class="combo-down">&#9660;</button>
          </div>
        </div>
        <div class="combo-cell" data-key="blue">
          <div class="combo-color-bar blue"></div>
          <div class="combo-controls">
            <button class="combo-up">&#9650;</button>
            <div class="combo-digit" id="combo-blue">0</div>
            <button class="combo-down">&#9660;</button>
          </div>
        </div>
      </div>
      <button class="combo-submit" id="combo-submit">VERIFICAR</button>
    </div>
  </div>

  <div id="clue-overlay">
    <div class="clue-note">
      <div class="clue-header">
        <span class="clue-color-bar"></span>
        <button class="clue-close" id="clue-close">&times;</button>
      </div>
      <p class="clue-text" id="clue-text"></p>
    </div>
  </div>

  <div id="victory-overlay">
    <div class="victory-content">
      <h1>Escapaste la E303</h1>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
